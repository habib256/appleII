# ld65 linker configuration for pure assembly SPACETRIP
# Produces a ProDOS BIN binary loaded at $4000
#
# Memory map:
#   $0000-$1FFF : ProDOS / zero-page / stack / text page
#   $2000-$3FFF : HGR Page 1 (8 KB image, preserved)
#   $4000-$9FFF : Program code + data (24 KB)
#   $A000-$BEFF : Free (file buffer / MLI io_buffer)
#   $BF00-$BFFF : ProDOS MLI entry
#   $C000-$FFFF : I/O soft switches + ROM

FEATURES {
    STARTADDRESS: default = $4000;
}

MEMORY {
    ZP:     file = "",           start = $0080, size = $001A, type = rw, define = yes;
    HEADER: file = %O,           start = $0000, size = $0004;
    MAIN:   file = %O, define = yes, start = %S, size = $6000;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HEADER:   load = HEADER, type = ro;
    STARTUP:  load = MAIN,   type = ro;
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro;
    DATA:     load = MAIN,   type = rw;
    BSS:      load = MAIN,   type = bss, define = yes, align = $100;
}
