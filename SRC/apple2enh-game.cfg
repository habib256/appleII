# Configuration cc65 étendue pour les moteurs de jeu Apple IIe Enhanced
#
# Différences avec /usr/share/cc65/cfg/apple2enh.cfg :
#
#   1. STARTADDRESS = $4000 au lieu de $0803
#      Préserve HGR page 1 ($2000-$3FFF), où les moteurs chargent les images.
#      Évite d'avoir à passer -Wl -S,0x4000 à chaque compilation.
#
#   2. __HIMEM__ = $BF00 au lieu de $9600
#      C'est le gain principal : +10 496 octets.
#      $9600 est la valeur prudente de cc65, qui suppose BASIC.SYSTEM résident
#      en $9600-$BEFF — ce qu'implique un lancement par ]BRUN. Un programme qui
#      renonce à revenir au BASIC peut utiliser cette zone. La limite absolue
#      est $BF00, début de la page globale ProDOS 8 (jamais disponible).
#
# CONTREPARTIE OBLIGATOIRE
# ------------------------
# La BSS et le tas s'étendent au-dessus de $9600 et DÉTRUISENT BASIC.SYSTEM en
# cours d'exécution. Le programme ne peut donc plus en sortir par exit(), qui
# rend la main à un BASIC.SYSTEM devenu inexistant.
#
# Il doit quitter par l'appel MLI QUIT ($BF00, code $65) — voir prodos_quit.c.
# Un exit() laissé en place plante la machine à la sortie du jeu.
#
# À NE PAS FAIRE : reloger la BSS en RAM basse
# --------------------------------------------
# $0800-$1FFF (6 Ko) est libre, puisque le chargement commence à $4000. Y placer
# la BSS semble un gain facile. C'en est un piège.
#
# Dans cc65 le tas n'est pas un segment : _heap.o n'importe que sp,
# __STACKSIZE__, __BSS_SIZE__ et __BSS_RUN__, et calcule
#     __heaporg = __BSS_RUN__ + __BSS_SIZE__
# Le tas suit donc la BSS. Relogée en $0800, le tas démarre vers $1B96 et
# s'étend jusqu'à la pile, traversant HGR page 1 puis tout le code. fopen()
# allouant 1 Ko par fichier ouvert, l'image affichée puis le programme seraient
# écrasés — sans le moindre diagnostic.
#
# tools/check-memory.sh refuse cette configuration.
#
# Vérification après chaque build :
#     ./tools/check-memory.sh build.map --himem 0xBF00

FEATURES {
    STARTADDRESS: default = $4000;      # préserve HGR page 1 $2000-$3FFF
}
SYMBOLS {
    __EXEHDR__:    type = import;
    __FILETYPE__:  type = weak, value = $0006;  # type ProDOS BIN
    __STACKSIZE__: type = weak, value = $0800;  # pile C, 2 Ko
    __HIMEM__:     type = weak, value = $BF00;  # page globale ProDOS 8
    __LCADDR__:    type = weak, value = $D400;  # derrière le code quit
    __LCSIZE__:    type = weak, value = $0C00;  # reste de la banque deux
}
MEMORY {
    ZP:     file = "", define = yes, start = $0080,        size = $001A;
    HEADER: file = %O,               start = %S - $003A,   size = $003A;
    MAIN:   file = %O, define = yes, start = %S,           size = __HIMEM__ - %S;
    BSS:    file = "",               start = __ONCE_RUN__, size = __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__;
    LC:     file = "", define = yes, start = __LCADDR__,   size = __LCSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    EXEHDR:   load = HEADER,         type = ro,  optional = yes;
    STARTUP:  load = MAIN,           type = ro;
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    CODE:     load = MAIN,           type = ro;
    RODATA:   load = MAIN,           type = ro;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;
    ONCE:     load = MAIN,           type = ro,  define   = yes;
    LC:       load = MAIN, run = LC, type = ro,  optional = yes;
    BSS:      load = BSS,            type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
